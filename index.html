:root {

    --text-primary: #1c1917;
    --text-secondary: #57534e;
    --text-muted: #78716c;
    --border-color: #e7e5e4;
    --border-subtle: #f0eee9;

* {

    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100%;
    width: 100%;
    font-family: var(--font-ui);
    background-color: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
}

.landing-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background-color: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}


.landing-topbar {
    display: flex;
    justify-content: flex-end;
    padding: 1rem 1.5rem;
}

.lang-flag-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

.lang-flag-btn {
    border: none;
    background: transparent;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.15s ease, color 0.15s ease;
}

.lang-flag-btn.active {
    background: var(--bg-panel-header);
    color: var(--text-primary);
    font-weight: 600;
}

.landing-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.5rem 3.5rem;
    text-align: center;
}

.landing-card {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
}

.landing-heading-group {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
}

.landing-title {
    font-family: var(--font-hebrew);
    font-size: clamp(1.85rem, 4vw, 2.5rem);
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-primary);
}

.landing-subtitle {
    font-family: var(--font-hebrew);
    font-size: clamp(1.05rem, 2.2vw, 1.3rem);
    font-weight: 400;
    line-height: 1.55;
    color: var(--text-secondary);
}

.landing-overlay[dir="ltr"] .landing-title,
.landing-overlay[dir="ltr"] .landing-subtitle {
    font-family: var(--font-english);
}

.landing-rule {
    width: 140px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d6d3d1 20%, #d6d3d1 80%, transparent);
}

.landing-cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    padding: 0.85rem 1.75rem;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #ffffff;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;

.landing-cta-btn:hover {
    background: var(--accent-hover);

}

.landing-cta-badge {

    font-weight: 500;

    padding: 2px 8px;

.landing-picker-card {

    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1rem 1.15rem;

    text-align: start;
}

.landing-picker-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);

    align-items: center;
    gap: 0.5rem;

}

.landing-picker-select:focus {

    border-color: var(--accent);
}

.landing-picker-open-btn {
    padding: 0.5rem 1rem;

    background: var(--border-color);

.landing-footer-note {
    font-size: 0.78rem;
    color: var(--text-muted);

.sr-only {

            [['landing-title', 'title'], ['landing-subtitle', 'subtitle'], ['landing-cta-label', 'cta'],
             ['landing-picker-label', 'pickerLabel'], ['btn-landing-open', 'pickerOpen'],
             ['landing-footer-note', 'footer']].forEach(function (pair) {
                var el = document.getElementById(pair[0]);
                if (el) el.textContent = copy[pair[1]];
            });
        }

        function initPicker() {
            var select = document.getElementById('landing-page-select');
            var currentLabel = null, group = null;
            PAGE_GROUPS.forEach(function (label, idx) {
                if (label !== currentLabel) {
                    currentLabel = label;
                    group = document.createElement('optgroup');
                    group.label = label;
                    select.appendChild(group);
                }
                var opt = document.createElement('option');
                opt.value = String(idx + 1);
                opt.textContent = formatPageDafAmud(idx + 1);
                group.appendChild(opt);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            initPicker();
            var lang = get('rymh.uiLang') || get('iyye_ui_lang') || 'he';
            applyUiLanguage(lang);
            document.querySelectorAll('.lang-flag-btn').forEach(function (btn) {
                btn.addEventListener('click', function () { applyUiLanguage(btn.dataset.lang); });
            });
            document.getElementById('btn-landing-start').addEventListener('click', function () { openReader(1); });
            document.getElementById('btn-landing-open').addEventListener('click', function () {
                openReader(parseInt(document.getElementById('landing-page-select').value, 10));
            });
        });
    })();
    </script>
</body>
</html>
