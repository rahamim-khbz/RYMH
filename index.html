<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; connect-src 'self' https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; img-src 'self' data: https://lh3.googleusercontent.com; frame-src https://iyye-hayyam.firebaseapp.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Distribution & Claim Dashboard — Iyye Hayyam</title>
  <link rel="stylesheet" href="static/css/review.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      overflow-y: auto !important;
      height: auto;
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-main);
    }
    .dash-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .dash-hero {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .dash-title h1 {
      font-size: 22px;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .dash-title p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .dash-stats {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stat-pill {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-blue);
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .page-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .page-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-blue);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .page-card.highlighted-batch {
      border: 2px solid var(--accent-amber);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }
    .card-thumb-wrap {
      height: 140px;
      background: var(--scan-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      opacity: 0.88;
      transition: opacity 0.2s;
    }
    .page-card:hover .card-thumb {
      opacity: 1;
    }
    .card-content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-weight: 700;
      font-size: 15px;
    }
    .card-progress-bar {
      height: 4px;
      background: var(--bg-subtle);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .card-progress-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.3s;
    }
    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="review-header" dir="ltr">
    <div class="header-left">
      <a href="editorial.html" class="btn" id="btnEditorialHub" title="Editorial Review Hub — Open Questions & Submitted Edits">⚖️ Editorial Hub</a>
      <span class="page-title">📜 Iyye Hayyam — Phase I Review Distribution</span>
    </div>
    <div class="header-right">
      <button class="btn" id="btnSignOut" title="Sign out of this site">⎋ Sign out</button>
      <button class="btn" id="btnOpenGuide" title="Reviewer Guide">❓ Guide</button>
      <button class="btn" id="dashThemeToggle" title="Toggle Theme (Dark / Sepia / Light)">🌙 Dark</button>
      <button class="btn" id="dashReviewerBtn" title="Set Reviewer Name">
        👤 <span id="dashReviewerDisplay">Reviewer</span>
      </button>
    </div>
  </header>

  <div class="dash-container">
    <div class="dash-hero">
      <div class="dash-title">
        <h1>Manuscript Folio Distribution (Siman 187)</h1>
        <p>Claim folios, proofread line-by-line transcription, and bold Ashurit script against original manuscript scans</p>
      </div>
      <div class="dash-stats">
        <div class="stat-pill">
          <div class="stat-num" id="statCompleted">0 / 89</div>
          <div class="stat-lbl">Completed</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num" id="statInProgress">0</div>
          <div class="stat-lbl">In Progress</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num" id="statAvailable">89</div>
          <div class="stat-lbl">Available</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All (89)</button>
      <button class="filter-btn" data-filter="available">Available</button>
      <button class="filter-btn" data-filter="in_progress">In Progress</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="flagged">🚩 Flagged</button>
      <button class="filter-btn" data-filter="my_pages">My Pages</button>
    </div>

    <!-- 89 Page Cards Grid -->
    <div class="page-grid" id="pageGrid"></div>
  </div>

  <script src="static/js/auth_gate.js"></script>
  <script src="static/js/review_sync.js"></script>
  <script src="static/js/dashboard.js"></script>
  <script src="static/js/guide_modal.js"></script>
</body>
</html>
